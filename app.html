<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F6F7FB">
  <meta name="description" content="AstroHealth AI — crew health dashboards.">
  <title>Overview — AstroHealth AI</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/app-icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/app-icons/apple-touch-icon.png">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/print.css" media="print">
  <!-- Page styles (css/pages/*.css) -->
  <link rel="stylesheet" href="css/pages/astronaut-overview.css">
  <link rel="stylesheet" href="css/pages/crew-monitor.css">
  <link rel="stylesheet" href="css/pages/health.css">
  <link rel="stylesheet" href="css/pages/simulation.css">
  <link rel="stylesheet" href="css/pages/alerts.css">
  <link rel="stylesheet" href="css/pages/history.css">
  <link rel="stylesheet" href="css/pages/reports.css">
  <link rel="stylesheet" href="css/pages/settings.css">

  <script type="module" src="js/app.js"></script>
  <!-- Auth guard + role-aware shell: redirects to login.html without a valid session -->
  <script type="module" src="js/pages/app-shell.js"></script>
  <script>
    if (location.protocol === "file:") document.addEventListener("DOMContentLoaded", function () {
      var b = document.createElement("div"); b.className = "env-warning"; b.setAttribute("role", "alert");
      b.textContent = "Run via a local server (python3 -m http.server 8080) — offline mode and the database need it.";
      document.body.prepend(b);
    });
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <noscript><p class="disclaimer">AstroHealth AI needs JavaScript. Please enable it and reload.</p></noscript>

  <!-- App shell (css/layout.css). Hidden until js/pages/app-shell.js has
       confirmed a valid session, so signed-out visitors never see it. -->
  <div class="app-shell" data-auth-shell style="visibility: hidden">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="sidebar__header">
        <a class="logo" href="#/overview">
          <img class="logo__mark" src="assets/brand/logo-mark.svg" alt="" width="36" height="36">
          <span class="logo__text"><span class="logo__name">AstroHealth AI</span><span class="logo__tag">Crew Health System</span></span>
        </a>
      </div>

      <nav aria-label="Dashboard sections">
        <p class="sidebar__section-label">Monitoring</p>
        <!-- Filled by js/pages/app-shell.js from ROUTES, for the signed-in role only -->
        <ul class="nav" role="list" data-nav></ul>
      </nav>

      <div class="sidebar__footer">
        <a class="nav__item" href="about.html"><i data-icon="book-open"></i><span class="nav__label">About &amp; References</span></a>
        <div class="offline-card" data-offline-status role="status">
          <span class="offline-card__icon"><i data-icon="wifi"></i></span>
          <div>
            <p class="offline-card__title">Checking…</p>
            <p class="offline-card__text">Offline status</p>
          </div>
        </div>
      </div>
    </aside>
    <div class="sidebar-scrim" aria-hidden="true"></div>

    <div class="app-main">
      <header class="topbar">
        <button class="icon-btn topbar__menu" type="button" data-drawer-toggle aria-controls="sidebar" aria-expanded="false" aria-label="Open menu"><i data-icon="menu"></i></button>
        <h1 class="topbar__title" id="page-title" tabindex="-1">Overview</h1>
        <!-- Filled by js/services/mission-service.js from the seeded (synthetic)
             settings record "mission"; "Not available" if it can't be read. -->
        <div class="topbar__chips" data-mission-context>
          <span class="chip"><i data-icon="rocket"></i> Mission <strong data-mission-name>—</strong></span>
          <span class="chip"><i data-icon="calendar"></i> Mission Day <strong data-mission-day>—</strong></span>
        </div>
        <div class="topbar__actions">
          <!-- Plain link to the Alerts page. No unread count until alerts are built. -->
          <a class="icon-btn" href="#/alerts" aria-label="Alerts" title="Alerts"><i data-icon="bell"></i></a>
          <div class="topbar__user">
            <span class="avatar avatar--brand" aria-hidden="true" data-user-initials></span>
            <div class="topbar__user-text">
              <p class="topbar__user-name" data-user-name></p>
              <p class="topbar__user-role" data-user-role></p>
            </div>
            <button class="icon-btn icon-btn--bordered" type="button" data-logout aria-label="Log out"><i data-icon="log-out"></i></button>
          </div>
        </div>
      </header>

      <main class="content" id="main">
        <!-- The current route's view is rendered here by js/pages/app-shell.js -->
        <div data-route-view></div>
      </main>

      <footer class="disclaimer">
        Research &amp; educational prototype · Not a medical device · Not affiliated with or endorsed by NASA · All health data synthetic
      </footer>
    </div>
  </div>
</body>
</html>
